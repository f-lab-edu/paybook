spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    driver-class-name: org.postgresql.Driver
    username: paybook
    password: paybook
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

order:
  discount:
    max-discount-percent: 30
    min-pg-payment-percent: 50
  delivery:
    fee: 3000
    free-threshold: 30000
  payment:
    timeout-minutes: 30
  payment-service:
    base-url: http://localhost:8081
