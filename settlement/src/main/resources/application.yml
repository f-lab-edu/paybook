spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:postgresql://localhost:5434/settlementdb
    driver-class-name: org.postgresql.Driver
    username: paybook
    password: paybook
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8082

settlement:
  order-service:
    base-url: http://localhost:8080
  policy:
    default-commission-rate: 30
    confirm-delay-days: 7
